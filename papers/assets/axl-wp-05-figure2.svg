<path d="M777.0 513.0 L673.0 617.0" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<path d="M527.0 617.0 L423.0 513.0" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<path d="M423.0 367.00000000000006 L527.0 263.0" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<rect x="446.0" y="137.0" width="320" height="118" fill="#1A1A1A"/>
<rect x="440.0" y="131.0" width="320" height="118" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="458.0" y="165.0" class="n" text-anchor="start" fill="#1A1A1A">Patient</text>
<text x="458.0" y="196.0" class="t" text-anchor="start" fill="#1A1A1A">Cannot yet tolerate an</text>
<text x="458.0" y="221.0" class="t" text-anchor="start" fill="#1A1A1A">unwelcome reality</text>
<rect x="696.0" y="387.0" width="320" height="118" fill="#1A1A1A"/>
<rect x="690.0" y="381.0" width="320" height="118" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="708.0" y="415.0" class="n" text-anchor="start" fill="#1A1A1A">Therapist</text>
<text x="708.0" y="446.0" class="t" text-anchor="start" fill="#1A1A1A">Trained to put subjective</text>
<text x="708.0" y="471.0" class="t" text-anchor="start" fill="#1A1A1A">experience first</text>
<rect x="446.0" y="637.0" width="320" height="118" fill="#1A1A1A"/>
<rect x="440.0" y="631.0" width="320" height="118" fill="#00FF41" stroke="#1A1A1A" stroke-width="3"/>
<text x="458.0" y="665.0" class="n" text-anchor="start" fill="#1A1A1A">Attunement</text>
<text x="458.0" y="696.0" class="t" text-anchor="start" fill="#1A1A1A">Confirms the self-concept</text>
<rect x="196.0" y="387.00000000000006" width="320" height="118" fill="#1A1A1A"/>
<rect x="190.0" y="381.00000000000006" width="320" height="118" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="208.0" y="415.00000000000006" class="n" text-anchor="start" fill="#1A1A1A">Reinforcement</text>
<text x="208.0" y="446.00000000000006" class="t" text-anchor="start" fill="#1A1A1A">Reality-testing never arrives</text>
<text x="600" y="820" class="t" text-anchor="middle" fill="#1A1A1A">The way out is calibration: validation delivered with enough safety that reality can be taken in (§5.3).</text>
</svg>