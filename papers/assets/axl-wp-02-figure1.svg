<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="A self-fulfilling loop. Drivers privately prefer the zipper merge but believe others see late merging as cheating, so they merge early. A minority block the open lane, which makes late merging genuinely unsafe, which looks like evidence for the original belief.">
<rect width="100%" height="100%" fill="#F2F1ED"/><style>.l{font:700 15px "JetBrains Mono",Courier,monospace;letter-spacing:2px}.s{font:700 13px "JetBrains Mono",Courier,monospace;letter-spacing:1.5px}.n{font:700 22px Inter,Arial,sans-serif}.b{font:900 26px Inter,Arial,sans-serif;letter-spacing:-.5px}.t{font:400 18px Inter,Arial,sans-serif}.k{font:900 40px Inter,Arial,sans-serif;letter-spacing:-1px}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B6B2E"/></marker></defs>
<text x="50" y="56" class="l" text-anchor="start" fill="#1A1A1A">FIG. 01 // THE ASSURANCE TRAP</text>
<path d="M715.6160813195786 234.0 L798.232569057822 294.02439185626736" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<path d="M886.5553958938365 462.02439185626736 L821.2623877400803 662.9756081437326" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<path d="M619.9691332565161 746.9756081437326 L580.0308667434839 746.9756081437326" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<path d="M378.73761225991973 662.9756081437326 L313.44460410616347 462.0243918562674" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<path d="M401.76743094217784 294.0243918562674 L484.38391868042146 234.0" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<rect x="446.0" y="86.0" width="320" height="140" fill="#1A1A1A"/>
<rect x="440.0" y="80.0" width="320" height="140" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="458.0" y="114.0" class="n" text-anchor="start" fill="#1A1A1A">Private preference</text>
<text x="458.0" y="145.0" class="t" text-anchor="start" fill="#1A1A1A">Most drivers would rather</text>
<text x="458.0" y="170.0" class="t" text-anchor="start" fill="#1A1A1A">zipper. It is faster for them.</text>
<rect x="759.8486503774006" y="314.02439185626736" width="320" height="140" fill="#1A1A1A"/>
<rect x="753.8486503774006" y="308.02439185626736" width="320" height="140" fill="#00FF41" stroke="#1A1A1A" stroke-width="3"/>
<text x="771.8486503774006" y="342.02439185626736" class="n" text-anchor="start" fill="#1A1A1A">Perceived norm</text>
<text x="771.8486503774006" y="373.02439185626736" class="t" text-anchor="start" fill="#1A1A1A">They believe others see late</text>
<text x="771.8486503774006" y="398.02439185626736" class="t" text-anchor="start" fill="#1A1A1A">merging as cheating.</text>
<rect x="639.9691332565161" y="682.9756081437326" width="320" height="140" fill="#1A1A1A"/>
<rect x="633.9691332565161" y="676.9756081437326" width="320" height="140" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="651.9691332565161" y="710.9756081437326" class="n" text-anchor="start" fill="#1A1A1A">Early merge</text>
<text x="651.9691332565161" y="741.9756081437326" class="t" text-anchor="start" fill="#1A1A1A">So they merge early, and a</text>
<text x="651.9691332565161" y="766.9756081437326" class="t" text-anchor="start" fill="#1A1A1A">minority block the open lane.</text>
<rect x="252.0308667434839" y="682.9756081437326" width="320" height="140" fill="#1A1A1A"/>
<rect x="246.0308667434839" y="676.9756081437326" width="320" height="140" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="264.0308667434839" y="710.9756081437326" class="n" text-anchor="start" fill="#1A1A1A">Manufactured hazard</text>
<text x="264.0308667434839" y="741.9756081437326" class="t" text-anchor="start" fill="#1A1A1A">Blocking makes late merging</text>
<text x="264.0308667434839" y="766.9756081437326" class="t" text-anchor="start" fill="#1A1A1A">genuinely unsafe.</text>
<rect x="132.1513496225993" y="314.0243918562674" width="320" height="140" fill="#1A1A1A"/>
<rect x="126.1513496225993" y="308.0243918562674" width="320" height="140" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="144.1513496225993" y="342.0243918562674" class="n" text-anchor="start" fill="#1A1A1A">Belief confirmed</text>
<text x="144.1513496225993" y="373.0243918562674" class="t" text-anchor="start" fill="#1A1A1A">The hazard reads as proof the</text>
<text x="144.1513496225993" y="398.0243918562674" class="t" text-anchor="start" fill="#1A1A1A">norm was right.</text>
<text x="600" y="480" class="s" text-anchor="middle" fill="#1A1A1A">AN INFORMATION</text>
<text x="600" y="502" class="s" text-anchor="middle" fill="#1A1A1A">CAMPAIGN CAN&#x27;T</text>
<text x="600" y="524" class="s" text-anchor="middle" fill="#1A1A1A">BREAK THIS LOOP</text>
</svg>