<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Timeline. Before 2010 Arabic hip-hop builds a language of dissent. 7 November 2010, El Général releases Rais Lebled. 17 December 2010, Bouazizi&#x27;s self-immolation sparks protests. 6 January 2011, secret police arrest El Général. 14 January 2011, Ben Ali flees. January to February 2011, the song is chanted in Tahrir Square.">
<rect width="100%" height="100%" fill="#F2F1ED"/><style>.l{font:700 15px "JetBrains Mono",Courier,monospace;letter-spacing:2px}.s{font:700 13px "JetBrains Mono",Courier,monospace;letter-spacing:1.5px}.n{font:700 22px Inter,Arial,sans-serif}.b{font:900 26px Inter,Arial,sans-serif;letter-spacing:-.5px}.t{font:400 18px Inter,Arial,sans-serif}.k{font:900 40px Inter,Arial,sans-serif;letter-spacing:-1px}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B6B2E"/></marker></defs>
<text x="50" y="56" class="l" text-anchor="start" fill="#1A1A1A">FIG. 02 // THE ARAB SPRING, FROM TUNISIA OUTWARD</text>
<line x1="110" y1="110" x2="110" y2="590" stroke="#1A1A1A" stroke-width="4"/>
<rect x="98" y="120" width="24" height="24" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="150" y="139" class="s" text-anchor="start" fill="#1A1A1A">BEFORE 2010</text>
<text x="330" y="139" class="t" text-anchor="start" fill="#1A1A1A">Arabic hip-hop builds a language of dissent underground</text>
<rect x="98" y="200" width="24" height="24" fill="#00FF41" stroke="#1A1A1A" stroke-width="3"/>
<text x="150" y="219" class="s" text-anchor="start" fill="#1A1A1A">7 NOV 2010</text>
<text x="330" y="219" class="t" text-anchor="start" fill="#1A1A1A">El Général releases “Rais Lebled”: the cultural object</text>
<rect x="98" y="280" width="24" height="24" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="150" y="299" class="s" text-anchor="start" fill="#1A1A1A">17 DEC 2010</text>
<text x="330" y="299" class="t" text-anchor="start" fill="#1A1A1A">Bouazizi&#x27;s self-immolation: protests without a narrative vehicle</text>
<rect x="98" y="360" width="24" height="24" fill="#00FF41" stroke="#1A1A1A" stroke-width="3"/>
<text x="150" y="379" class="s" text-anchor="start" fill="#1A1A1A">6 JAN 2011</text>
<text x="330" y="379" class="t" text-anchor="start" fill="#1A1A1A">Police arrest El Général. The regime treats the song as a threat</text>
<rect x="98" y="440" width="24" height="24" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="150" y="459" class="s" text-anchor="start" fill="#1A1A1A">14 JAN 2011</text>
<text x="330" y="459" class="t" text-anchor="start" fill="#1A1A1A">Ben Ali flees</text>
<rect x="98" y="520" width="24" height="24" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="150" y="539" class="s" text-anchor="start" fill="#1A1A1A">JAN–FEB 2011</text>
<text x="330" y="539" class="t" text-anchor="start" fill="#1A1A1A">Tahrir Square chants “Rais Lebled”: the song crosses borders</text>
<text x="150" y="618" class="t" text-anchor="start" fill="#1A1A1A">Twitter distributed the energy. The culture made it (Layer 6).</text>
