<text x="440" y="154" class="b" text-anchor="start" fill="#1A1A1A">1986</text>
<text x="440" y="188" class="t" text-anchor="start" fill="#1A1A1A">California</text>
<text x="440" y="213" class="t" text-anchor="start" fill="#1A1A1A">creates a</text>
