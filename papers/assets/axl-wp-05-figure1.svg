<text x="998" y="238" class="t" text-anchor="start" fill="#1A1A1A">validation</text>
<text x="998" y="263" class="t" text-anchor="start" fill="#1A1A1A">engine yet</text>
<text x="50" y="410" class="t" text-anchor="start" fill="#1A1A1A">1989 is where the Pretend Era begins: private knowledge and public claim part ways, and nobody corrects the</text>
<text x="50" y="435" class="t" text-anchor="start" fill="#1A1A1A">record (§1.3).</text>
