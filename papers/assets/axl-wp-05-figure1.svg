<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Esalen opens at Big Sur in 1962. Branden&#x27;s self-esteem theory follows in 1969. California&#x27;s self-esteem task force is created in 1986 and in 1989 declares a link to social problems definitively confirmed, a claim the researchers knew was false. The Human Potential Movement then feeds Silicon Valley&#x27;s founding mythology, and the attention economy optimizes for self-regard; AI is the newest amplifier.">
<rect width="100%" height="100%" fill="#F2F1ED"/><style>.l{font:700 15px "JetBrains Mono",Courier,monospace;letter-spacing:2px}.s{font:700 13px "JetBrains Mono",Courier,monospace;letter-spacing:1.5px}.n{font:700 22px Inter,Arial,sans-serif}.b{font:900 26px Inter,Arial,sans-serif;letter-spacing:-.5px}.t{font:400 18px Inter,Arial,sans-serif}.k{font:900 40px Inter,Arial,sans-serif;letter-spacing:-1px}</style>
