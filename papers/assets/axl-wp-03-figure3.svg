<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="The ten cascade stages in order. Foundation capital enters upstream, funding Listening, Legitimacy and Trust and the ideation at Art. Brand and sponsor capital enters only at Funding, after Art has been independently ideated.">
