<text x="648" y="358" class="s" fill="#1A1A1A">DEFAULTS COUNT AS NOT REACHED</text>
<text x="648" y="390" class="n" text-anchor="start" fill="#1A1A1A">Merits-Reached Rate</text>
<text x="648" y="421" class="t" text-anchor="start" fill="#1A1A1A">Counts only cases decided on their merits. The</text>
<text x="648" y="446" class="t" text-anchor="start" fill="#1A1A1A">defaults score zero.</text>
<text x="50" y="530" class="s" text-anchor="start" fill="#1A1A1A">■ default judgment, no examination of the merits (Pew Charitable Trusts 2020)   □ other dispositions</text>
