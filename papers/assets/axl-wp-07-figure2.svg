<text x="68" y="358" class="s" fill="#1A1A1A">COUNTS ALL 100</text>
<text x="68" y="390" class="n" text-anchor="start" fill="#1A1A1A">Clearance rate</text>
<text x="68" y="421" class="t" text-anchor="start" fill="#1A1A1A">Every disposal counts. The 70+ defaults look like a</text>
<text x="68" y="446" class="t" text-anchor="start" fill="#1A1A1A">fast, healthy court.</text>
<rect x="636" y="336" width="520" height="150" fill="#1A1A1A"/>
