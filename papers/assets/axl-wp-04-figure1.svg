<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Cultural object, then permission structure, then identity formation, then political mobilization.">
<rect width="100%" height="100%" fill="#F2F1ED"/><style>.l{font:700 15px "JetBrains Mono",Courier,monospace;letter-spacing:2px}.s{font:700 13px "JetBrains Mono",Courier,monospace;letter-spacing:1.5px}.n{font:700 22px Inter,Arial,sans-serif}.b{font:900 26px Inter,Arial,sans-serif;letter-spacing:-.5px}.t{font:400 18px Inter,Arial,sans-serif}.k{font:900 40px Inter,Arial,sans-serif;letter-spacing:-1px}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker><marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B6B2E"/></marker></defs>
<text x="50" y="56" class="l" text-anchor="start" fill="#1A1A1A">FIG. 01 // THE PERMISSION PIPELINE</text>
<rect x="56" y="116" width="245" height="160" fill="#1A1A1A"/>
<rect x="50" y="110" width="245" height="160" fill="#00FF41" stroke="#1A1A1A" stroke-width="3"/>
<text x="68" y="144" class="n" text-anchor="start" fill="#1A1A1A">Cultural object</text>
<text x="68" y="175" class="t" text-anchor="start" fill="#1A1A1A">A song, film,</text>
<text x="68" y="200" class="t" text-anchor="start" fill="#1A1A1A">magazine, meme or</text>
<text x="68" y="225" class="t" text-anchor="start" fill="#1A1A1A">gathering</text>
<path d="M301 190 L329 190" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<rect x="341" y="116" width="245" height="160" fill="#1A1A1A"/>
<rect x="335" y="110" width="245" height="160" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="353" y="144" class="n" text-anchor="start" fill="#1A1A1A">Permission</text>
<text x="353" y="175" class="t" text-anchor="start" fill="#1A1A1A">Leave to feel or</text>
<text x="353" y="200" class="t" text-anchor="start" fill="#1A1A1A">become what people</text>
<text x="353" y="225" class="t" text-anchor="start" fill="#1A1A1A">already wanted</text>
<path d="M586 190 L614 190" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<rect x="626" y="116" width="245" height="160" fill="#1A1A1A"/>
<rect x="620" y="110" width="245" height="160" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="638" y="144" class="n" text-anchor="start" fill="#1A1A1A">Identity</text>
<text x="638" y="175" class="t" text-anchor="start" fill="#1A1A1A">“This is who I am now”</text>
<path d="M871 190 L899 190" fill="none" stroke="#1A1A1A" stroke-width="3" marker-end="url(#a)"/>
<rect x="911" y="116" width="245" height="160" fill="#1A1A1A"/>
<rect x="905" y="110" width="245" height="160" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
<text x="923" y="144" class="n" text-anchor="start" fill="#1A1A1A">Mobilization</text>
<text x="923" y="175" class="t" text-anchor="start" fill="#1A1A1A">“This is what people</text>
<text x="923" y="200" class="t" text-anchor="start" fill="#1A1A1A">like me do”</text>
<text x="50" y="330" class="t" text-anchor="start" fill="#1A1A1A">The far right already proved the pipeline works, without ethics or accountability (Layer 2).</text>
</svg>